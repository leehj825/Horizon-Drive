<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1c" />
  <title>Horizon Drive</title>
  <style>
    #splash { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 40%, #2a1450, #0b0d1c 70%); color: #eef2ff; font-family: system-ui, sans-serif; transition: opacity 0.5s; }
    #splash b { font-size: clamp(34px, 8vw, 64px); font-style: italic; font-weight: 900; letter-spacing: 0.05em; background: linear-gradient(90deg, #19e6ff, #ff3fa6); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #splash i { width: 120px; height: 3px; background: linear-gradient(90deg, #19e6ff, #ff3fa6); border-radius: 2px; animation: ld 1.1s ease-in-out infinite; }
    @keyframes ld { 0%, 100% { transform: scaleX(0.2); } 50% { transform: scaleX(1); } }
  </style>
</head>
<body>
  <div id="splash"><b>HORIZON DRIVE</b><i></i></div>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="touch" hidden>
    <div class="t-left">
      <button data-vbtn="left" aria-label="left">◀</button>
      <button data-vbtn="right" aria-label="right">▶</button>
    </div>
    <div class="t-right">
      <button data-vbtn="nitro" class="nitro" aria-label="nitro">NOS</button>
      <button data-vbtn="drift" class="drift" aria-label="drift">DRIFT</button>
      <button data-vbtn="brake" class="brake" aria-label="brake">BRAKE</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
