plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.leehj825.horizondrive'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.leehj825.horizondrive'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '0.2.0-pre'
    }

    buildFeatures {
        buildConfig true
    }

    // Release signing: only when the keystore is provided through the environment (see README / CI secrets).
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The game is the Vite production build in <repo>/dist (run `npm run build` first). It is copied, not duplicated
    // in git, into the app's assets under www/ before every build, and served to the WebView from a https:// origin.
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/www'))
    }
}

def webRoot = new File(rootProject.projectDir.parentFile, 'dist')
tasks.register('copyWeb', Copy) {
    doFirst {
        if (!new File(webRoot, 'index.html').exists()) {
            throw new GradleException("dist/index.html not found. Run 'npm install && npm run build' in the repository root first.")
        }
    }
    from(webRoot)
    into layout.buildDirectory.dir('generated/www/www')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyWeb' }
